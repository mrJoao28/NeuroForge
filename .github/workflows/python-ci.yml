name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check package files
        run: |
          test -f packages/neuroforge_core/pyproject.toml
          test -f packages/neuroforge_core/neuroforge_core/network.py
          test -f packages/neuroforge_core/tests/test_network.py
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './packages/neuroforge_core[test]'
      - name: Run tests
        run: python -m pytest -q packages/neuroforge_core/tests
