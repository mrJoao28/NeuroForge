name: Python CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install core and tests
        run: |
          python -m pip install --upgrade pip
          pip install -e './packages/neuroforge_core[test]'
      - name: Run tests
        run: pytest -q packages/neuroforge_core/tests
